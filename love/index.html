<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f5" />
  <title>I Love You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.8), transparent 26%),
        linear-gradient(135deg, #fff5f8 0%, #ffdce8 50%, #ffc7da 100%);
      color: #b3174a;
    }

    .message {
      width: min(92vw, 760px);
      text-align: center;
      padding: 42px 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 18px 60px rgba(177, 23, 74, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4.3rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      font-weight: 800;
      text-shadow: 0 4px 18px rgba(177, 23, 74, 0.08);
    }

    h1 + h1 {
      margin-top: 12px;
    }

    p {
      margin-top: 34px;
      font-size: clamp(1.2rem, 4vw, 2rem);
      line-height: 1.5;
      font-weight: 600;
      color: #7f2342;
    }

    @media (max-width: 480px) {
      .message {
        padding: 36px 18px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="message">
    <h1>I LOVE YOU MAMA</h1>
    <h1>I LOVE YOU DEDEK</h1>
    <p>Sehat terus ya</p>
  </main>
</body>
</html>
